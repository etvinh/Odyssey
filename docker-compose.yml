services:
  postgres:
    image: postgres:17-alpine
    container_name: odyssey-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: odyssey
      POSTGRES_PASSWORD: odyssey
      POSTGRES_DB: odyssey
    ports:
      - "5432:5432"
    volumes:
      - odyssey-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odyssey -d odyssey"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  odyssey-pgdata:
